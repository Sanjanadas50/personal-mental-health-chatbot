{% extends "base.html" %}
{% block content %}
<style>
  .login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
  }

  .login-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeIn 0.6s ease-in-out;
  }

  .login-card h2 {
    color: #4a6572;
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  .login-card p {
    color: #777;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #fafafa;
  }

  input:focus {
    outline: none;
    border-color: #64b5f6;
    background-color: #fff;
    box-shadow: 0 0 6px rgba(100, 181, 246, 0.3);
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #81c784, #64b5f6);
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .btn-login:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 15px rgba(100, 181, 246, 0.3);
  }

  .signup-link {
    margin-top: 20px;
    font-size: 0.95rem;
    color: #555;
  }

  .signup-link a {
    color: #64b5f6;
    font-weight: 600;
    text-decoration: none;
  }

  .signup-link a:hover {
    text-decoration: underline;
  }

  .error-msg {
    background: #ffebee;
    color: #c62828;
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 20px;
    font-size: 0.95rem;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>

<div class="login-container">
  <div class="login-card">
    <h2>Welcome Back</h2>
    <p>Log in to reconnect with Mina 🌿</p>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required>
      </div>
<div class="signup-link">
  <a href="{{url_for('forgot_password')}}">Forgot Password?</a>
</div>
      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="signup-link">
      Don’t have an account? <a href="{{ url_for('register') }}">Sign up</a>
    </div>
  </div>
</div>
{% endblock %}
