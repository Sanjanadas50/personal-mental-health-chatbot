<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mina — Your Wellness Companion</title>
  <link rel="icon" href="{{ url_for('static', filename='icon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ====== GLOBAL STYLES ====== */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #fce4ec);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 25px;
    }

    .container {
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 1200px;
      overflow: hidden;
      animation: fadeIn 0.6s ease-in-out;
    }

    /* ====== HEADER ====== */
    header {
      background: linear-gradient(90deg, #81c784, #64b5f6);
      color: #fff;
      padding: 25px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top-left-radius: 22px;
      border-top-right-radius: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span {
      font-size: 1.6rem;
    }

    .user-info {
      font-size: 1rem;
    }

    .user-info a {
      color: #fff;
      text-decoration: underline;
      margin-left: 10px;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }

    .user-info a:hover {
      opacity: 0.8;
    }

    /* ====== MAIN CONTENT ====== */
    main {
      padding: 40px;
      background-color: #fafafa;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* ====== BUTTON STYLE (GLOBAL) ====== */
    .btn {
      background: linear-gradient(90deg, #81c784, #64b5f6);
      border: none;
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .btn:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }

    /* ====== FOOTER (OPTIONAL) ====== */
    footer {
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
      color: #555;
      background: #fff;
      border-radius: 0 0 22px 22px;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1><span>🌿</span> Mina — Wellness Companion</h1>
      {% if session.username %}
      <div class="user-info">
        Hi, <strong>{{ session.username }}</strong> |
        <a href="{{ url_for('logout') }}">Logout</a>
      </div>
      {% endif %}
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer>
      Made with 💚 for emotional wellbeing • © 2025 Mina
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
