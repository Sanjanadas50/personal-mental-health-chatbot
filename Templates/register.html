{% extends "base.html" %}
{% block content %}
<style>
  .register-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
  }

  .register-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeIn 0.7s ease-in-out;
  }

  .register-card h2 {
    color: #4a6572;
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  .register-card p {
    color: #777;
    margin-bottom: 30px;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #fafafa;
  }

  input:focus {
    outline: none;
    border-color: #64b5f6;
    background-color: #fff;
    box-shadow: 0 0 6px rgba(100, 181, 246, 0.3);
  }

  .btn-register {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #81c784, #64b5f6);
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    letter-spacing: 0.4px;
  }

  .btn-register:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 15px rgba(100, 181, 246, 0.3);
  }

  .login-link {
    margin-top: 20px;
    font-size: 0.95rem;
    color: #555;
  }

  .login-link a {
    color: #64b5f6;
    font-weight: 600;
    text-decoration: none;
  }

  .login-link a:hover {
    text-decoration: underline;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(25px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>

<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>
    <p>Join Mina — your calm space to share, reflect, and heal 🌿</p>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" name="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" name="password" id="password" placeholder="Enter a strong password" required>
      </div>

      <button type="submit" class="btn-register">Sign Up</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
    </div>
  </div>
</div>
{% endblock %}
