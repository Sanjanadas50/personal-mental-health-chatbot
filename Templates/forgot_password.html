{% extends "base.html" %}
{% block content %}
<style>
  .reset-container {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 70vh;
  }

  .reset-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 40px 50px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: fadeIn 0.6s ease-in-out;
  }

  .reset-card h2 {
    color: #4a6572;
    font-size: 1.8rem;
    margin-bottom: 10px;
  }

  .reset-card p {
    color: #777;
    margin-bottom: 25px;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 6px;
    color: #555;
    font-weight: 500;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.3s ease;
    background-color: #fafafa;
  }

  input:focus {
    outline: none;
    border-color: #64b5f6;
    background-color: #fff;
    box-shadow: 0 0 6px rgba(100, 181, 246, 0.3);
  }

  .btn-reset {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    background: linear-gradient(90deg, #81c784, #64b5f6);
    color: white;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .btn-reset:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 15px rgba(100, 181, 246, 0.3);
  }

  .message {
    margin-bottom: 20px;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.95rem;
  }

  .success {
    background: #e8f5e9;
    color: #2e7d32;
  }

  .error {
    background: #ffebee;
    color: #c62828;
  }

  .back-link {
    margin-top: 20px;
    font-size: 0.95rem;
    color: #555;
  }

  .back-link a {
    color: #64b5f6;
    font-weight: 600;
    text-decoration: none;
  }

  .back-link a:hover {
    text-decoration: underline;
  }

  @keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
  }
</style>

<div class="reset-container">
  <div class="reset-card">
    <h2>Reset Password 🔐</h2>
    <p>Forgot your password? No worries! Enter your username and a new password below.</p>

    {% if message %}
      <div class="message {% if '✅' in message %}success{% else %}error{% endif %}">{{ message }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="new_password">New Password</label>
        <input type="password" name="new_password" id="new_password" placeholder="Enter your new password" required>
      </div>

      <button type="submit" class="btn-reset">Reset Password</button>
    </form>

    <div class="back-link">
      <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
  </div>
</div>
{% endblock %}
